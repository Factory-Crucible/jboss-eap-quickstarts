# Test-specific application configuration
spring.application.name=kitchensink-test
server.port=0

# Test Database Configuration - Using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA/Hibernate Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded

# Disable Hibernate automatic schema generation for MongoDB tests
spring.data.mongodb.auto-index-creation=false

# Test-specific MongoDB Configuration (used with testcontainers)
# These will be overridden by TestContainers when MongoDB tests are run
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=kitchensink-test

# Test Logging Configuration - Less verbose for tests
logging.level.root=ERROR
logging.level.com.example.kitchensink=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.springframework.boot.test=INFO

# Disable Spring Boot Actuator for tests
management.endpoints.web.exposure.include=
management.endpoint.health.show-details=never

# Test-specific Jackson Configuration
spring.jackson.serialization.indent-output=false

# Validation settings for tests
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Disable CORS for tests
spring.mvc.cors.enabled=false

# Always use test profile
spring.profiles.active=test

# Flyway and Liquibase should be disabled for tests
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Disable open session in view for tests
spring.jpa.open-in-view=false

# Random port for tests to avoid conflicts
server.port=0

# Enable test-specific features
spring.test.database.replace=any
