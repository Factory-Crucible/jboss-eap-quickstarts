# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open EntityManager in View to avoid warning messages
spring.jpa.open-in-view=false

# Logging Configuration for Tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.jboss.as.quickstarts.kitchensink=DEBUG
logging.level.org.springframework.test=INFO

# Disable Whitelabel Error Page
server.error.whitelabel.enabled=false

# Random port to avoid conflicts in test environment
server.port=0

# Disable data.sql script execution for tests (we'll use programmatic setup)
spring.sql.init.mode=never

# Disable cache for templates in test environment
spring.thymeleaf.cache=false
