# Test-specific application configuration
spring.application.name=kitchensink-spring-boot-test

# Test database configuration - separate from main database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# JPA/Hibernate test configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization for tests
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging configuration for tests
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.jboss.as.quickstarts.kitchensink=DEBUG

# Disable unnecessary features during testing
spring.main.banner-mode=off
spring.devtools.restart.enabled=false
spring.cache.type=none

# Test-specific settings
spring.test.database.replace=ANY
