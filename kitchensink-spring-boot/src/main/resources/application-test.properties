# ===============================
# = TEST DATA SOURCE
# ===============================
# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# ===============================
# = JPA / HIBERNATE TEST SETTINGS
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Disable open session in view for tests
spring.jpa.open-in-view=false

# ===============================
# = TEST LOGGING
# ===============================
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.kitchensink=DEBUG

# ===============================
# = TEST SERVER
# ===============================
server.port=0

# ===============================
# = THYMELEAF TEST SETTINGS
# ===============================
spring.thymeleaf.cache=false

# ===============================
# = TEST ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# = TEST SPECIFIC SETTINGS
# ===============================
# Disable data.sql execution for tests
spring.sql.init.mode=never

# Random server port for parallel test execution
spring.webmvc.hiddenmethod.filter.enabled=true
