# ===================================================================
# SPRING BOOT KITCHENSINK APPLICATION PROPERTIES
# ===================================================================
# This file replaces the original JBoss EAP configuration files:
# - src/main/webapp/WEB-INF/kitchensink-quickstart-ds.xml (datasource)
# - src/main/resources/META-INF/persistence.xml (JPA configuration)
# ===================================================================

# ----------------------------------------
# SERVER PROPERTIES
# ----------------------------------------
# Standard Spring Boot server configuration
server.port=8080
server.servlet.context-path=/kitchensink

# ----------------------------------------
# DATASOURCE PROPERTIES
# ----------------------------------------
# Migrated from kitchensink-quickstart-ds.xml
# Original used JNDI name: java:jboss/datasources/KitchensinkQuickstartDS
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.name=KitchensinkQuickstartDS

# ----------------------------------------
# H2 CONSOLE
# ----------------------------------------
# Enable H2 web console for development (not in original kitchensink)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------
# JPA / HIBERNATE PROPERTIES
# ----------------------------------------
# Migrated from persistence.xml
# Original used hibernate.hbm2ddl.auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# These settings replicate the original persistence.xml behavior
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# ----------------------------------------
# DATA INITIALIZATION
# ----------------------------------------
# Configure SQL initialization (replaces import.sql behavior)
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# ----------------------------------------
# LOGGING CONFIGURATION
# ----------------------------------------
# Enhanced logging for development (more detailed than original)
logging.level.root=INFO
logging.level.com.factory.kitchensink=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log pattern with timestamp, level, thread, and class
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ----------------------------------------
# ADDITIONAL SPRING BOOT SETTINGS
# ----------------------------------------
# Error handling (not in original kitchensink)
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator endpoints for monitoring (enhancement over original)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
