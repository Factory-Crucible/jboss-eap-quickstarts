# Spring Boot Kitchensink Application Configuration

# ===============================
# = DATA SOURCE
# ===============================
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:kitchensink
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
# Enable H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Initialize the database using data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===============================
# = SERVER
# ===============================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# = LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example.kitchensink=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# = ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true

# ===============================
# = THYMELEAF
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===============================
# = MISCELLANEOUS
# ===============================
# Enable response compression
server.compression.enabled=true
# Minimum response size for compression
server.compression.min-response-size=1024
# MIME types that should be compressed
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===============================
# = APPLICATION SPECIFIC
# ===============================
# Add custom application properties here
app.name=Kitchensink
app.description=Spring Boot migration of JBoss kitchensink
app.version=1.0.0
