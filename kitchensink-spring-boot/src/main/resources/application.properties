# ======================================================
# Application Configuration
# ======================================================
# Application name and server port
spring.application.name=kitchensink-spring-boot
server.port=8080

# ======================================================
# H2 Database Configuration
# ======================================================
# Configure H2 database connection
spring.datasource.url=jdbc:h2:mem:kitchensinkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 console for development (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ======================================================
# JPA / Hibernate Configuration
# ======================================================
# Configure JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL initialization from import.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ======================================================
# Logging Configuration
# ======================================================
# Configure logging levels
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.jboss.as.quickstarts.kitchensink.springboot=DEBUG

# Configure logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
