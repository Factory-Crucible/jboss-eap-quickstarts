# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# = H2 DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===============================
# = ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
management.metrics.tags.application=kitchensink-spring-boot

# ===============================
# = LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.example.kitchensink=DEBUG

# ===============================
# = MONGODB CONFIGURATION (OPTIONAL)
# ===============================
# Uncomment the following properties to use MongoDB instead of H2
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=kitchensink
# spring.data.mongodb.authentication-database=admin
# spring.data.mongodb.username=
# spring.data.mongodb.password=

# ===============================
# = APPLICATION INFORMATION
# ===============================
spring.application.name=Kitchensink Spring Boot
info.app.name=Kitchensink Spring Boot Application
info.app.description=Spring Boot migration of JBoss EAP Kitchensink application
info.app.version=1.0.0
