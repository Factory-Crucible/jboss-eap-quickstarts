spring:
  application:
    name: kitchensink
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:kitchensinkdb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  
  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # MongoDB Configuration (commented out by default)
  #data:
  #  mongodb:
  #    host: localhost
  #    port: 27017
  #    database: kitchensink

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /kitchensink

# Logging Configuration
logging:
  level:
    org.springframework: INFO
    org.hibernate: INFO
    org.jboss.as.quickstarts: DEBUG
