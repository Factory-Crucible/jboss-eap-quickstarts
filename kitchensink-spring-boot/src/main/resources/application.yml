# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /kitchensink

# Spring Configuration
spring:
  application:
    name: kitchensink-spring-boot
  
  # Profile-specific configuration
  config:
    activate:
      on-profile: default
  
  # H2 Database Configuration (default profile)
  datasource:
    url: jdbc:h2:mem:kitchensinkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false
  
  # MongoDB Configuration (activated with mongodb profile)
  data:
    mongodb:
      uri: mongodb://localhost:27017/kitchensink
      auto-index-creation: true
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate: INFO
    com.example.kitchensink: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/kitchensink.log

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-actuator: true

# Custom Application Properties
app:
  version: 1.0.0
  description: Spring Boot migration of JBoss kitchensink quickstart

---
# MongoDB Profile Configuration
spring:
  config:
    activate:
      on-profile: mongodb
  
  # Disable JPA for MongoDB profile
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/kitchensink
      auto-index-creation: true

---
# Production Profile Configuration
spring:
  config:
    activate:
      on-profile: prod
  
  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/kitchensink
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  
  # Disable H2 Console in Production
  h2:
    console:
      enabled: false

# Production Logging Configuration
logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    com.example.kitchensink: INFO
