spring:
  application:
    name: kitchensink
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:kitchensinkdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /kitchensink

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
