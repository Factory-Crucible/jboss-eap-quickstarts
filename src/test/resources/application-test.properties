# Test-specific application properties
# Uses in-memory H2 database and random port for testing

# Random port configuration
server.port=0

# H2 Database Configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Open EntityManager in View to avoid potential issues in tests
spring.jpa.open-in-view=false

# Data initialization
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

# Logging levels for tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.test=INFO
logging.level.org.jboss.as.quickstarts.kitchensink=DEBUG

# Disable Thymeleaf cache for tests
spring.thymeleaf.cache=false
