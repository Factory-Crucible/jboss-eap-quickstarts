# Spring Boot application configuration
# Common settings for all profiles

spring:
  application:
    name: kitchensink
  
  # Default profile is 'dev'
  profiles:
    active: dev
  
  # JPA common configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        id.new_generator_mappings: true
        connection.provider_disables_autocommit: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
        generate_statistics: false

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /kitchensink
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
    min-response-size: 1024

# Logging configuration
logging:
  level:
    root: INFO
    com.example.kitchensink: INFO
    org.hibernate.SQL: INFO
    org.springframework: INFO

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Profile-specific configurations
---
# Development profile
spring:
  config:
    activate:
      on-profile: dev
  
  # H2 Database configuration
  datasource:
    url: jdbc:h2:mem:kitchensinkdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA/Hibernate configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logging for development
logging:
  level:
    com.example.kitchensink: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Test profile
spring:
  config:
    activate:
      on-profile: test
  
  # H2 Database configuration for testing
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  
  # JPA/Hibernate configuration for testing
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Logging for testing
logging:
  level:
    com.example.kitchensink: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  
  # Database configuration for production
  # Replace with actual production database details
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kitchensink}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      poolName: Hikari
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000
  
  # JPA/Hibernate configuration for production
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        connection.provider_disables_autocommit: true

# Logging for production
logging:
  level:
    root: INFO
    com.example.kitchensink: INFO
    org.springframework: WARN
  file:
    name: /var/log/kitchensink/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

# Server configuration for production
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-threads: 200
    min-spare-threads: 20
