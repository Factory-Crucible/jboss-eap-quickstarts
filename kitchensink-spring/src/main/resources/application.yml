spring:
  application:
    name: kitchensink
  
  datasource:
    url: jdbc:h2:mem:kitchensinkdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
server:
  port: 8080
  servlet:
    context-path: /kitchensink
  
logging:
  level:
    root: INFO
    com.example.kitchensink: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
