spring:
  application:
    name: kitchensink-spring
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Database Configuration (default)
  datasource:
    url: jdbc:h2:mem:kitchensinkdb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  
  # MongoDB Configuration (commented out by default)
  #data:
  #  mongodb:
  #    host: localhost
  #    port: 27017
  #    database: kitchensink
  
  # Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics

# Server Configuration
server:
  port: 8080
