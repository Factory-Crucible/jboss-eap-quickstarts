# Spring Boot Application Configuration for Kitchensink Application

# ===============================
# = DATA SOURCE
# ===============================
# H2 Database Configuration (for development)
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Enable schema generation from import.sql
spring.sql.init.mode=always

# ===============================
# = CONNECTION POOL
# ===============================
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.jboss.as.quickstarts.kitchensink=DEBUG

# ===============================
# = SERVER
# ===============================
server.port=8080
server.servlet.context-path=/kitchensink

# ===============================
# = JACKSON
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
